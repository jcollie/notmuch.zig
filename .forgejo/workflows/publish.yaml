name: Publish docs

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build docs
        run: nix develop -c zig build docs

      - name: Publish docs
        run: nix develop -c git-pages-cli https://zig-notmuch.jeff.ocj.page --server ocj.page --token ${{ forge.token }} --upload-dir zig-out/docs
