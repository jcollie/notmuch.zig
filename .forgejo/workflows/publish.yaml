name: Publish docs

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build docs
        run: nix develop -c zig build docs

      - name: Publish docs
        run: nix develop -c git-pages-cli https://jeff.ocj.page/notmuch.zig/ --server ocj.page --token ${{ forge.token }} --upload-dir zig-out/docs
