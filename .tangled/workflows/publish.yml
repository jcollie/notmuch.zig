when:
  - event:
      - push
    branch:
      - main
  - event:
      - manual

engine: nixery

dependencies:
  nixpkgs:
    - curl

environment:
  SITE_PATH: zig-out/docs
  SITE_NAME: notmuch.zig

steps:
  - name: Build site
    command: nix develop -c zig build docs

  - name: Install Wisp CLI
    command: |
      curl -o /tmp/wisp-cli https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-x86_64-linux
      chmod a+x /tmp/wisp-cli

  - name: deploy to wisp
    command: |
      /tmp/wisp-cli \
        "$WISP_HANDLE" \
        --path "$SITE_PATH" \
        --name "$SITE_NAME" \
        --password "$WISP_APP_PASSWORD"
