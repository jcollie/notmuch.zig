when:
  - event:
      - push
    branch:
      - main
  - event:
      - manual

engine: nixery

dependencies:
  nixpkgs:
    - curl

environment:
  TERM: dumb
  NO_COLOR: "true"
  SITE_PATH: zig-out/docs
  SITE_NAME: notmuch.zig

steps:
  - name: Build site
    command: nix develop -c zig build docs

  - name: deploy to wisp
    command: |
      curl -s -o ./wispcli https://sites.wisp.place/nekomimi.pet/wisp-cli-binaries/wisp-cli-x86_64-linux
      chmod a+x ./wispcli
      ls -l ./wispcli
      ldd ./wispcli
      ./wispcli \
        "$WISP_HANDLE" \
        --path "$SITE_PATH" \
        --name "$SITE_NAME" \
        --password "$WISP_APP_PASSWORD"
